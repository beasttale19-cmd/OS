<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator!</title>
        <link rel="icon" href="../images/win-logo.png" type="image/png">
        <link rel="stylesheet" href="css/calculator.css">
        <link rel="stylesheet" href="../css/font.css">
    </head>
    <body>

        <div class="appname">
            <h2 class="app-name">Calculator!</h2>
        </div>

        <nav class="nav1">
            <a href="main.html" style="font-size:1.5em; font-weight:900;">-</a>
            <a href="main.html">✖</a>
        </nav>

        <div class="calci">
            <div class="content">

                <div class="display">

                </div>

                <div class="input">
                    <div class="number">
                        <a href>1</a>
                        <a href>2</a>
                        <a href>3</a>
                        <a href>4</a>
                        <a href>5</a>
                        <a href>6</a>
                        <a href>7</a>
                        <a href>8</a>
                        <a href>9</a>
                        <a href>0</a>
                    </div>
                    <div class="symbol">
                        <a href>+</a>
                        <a href>-</a>
                        <a href>*</a>
                        <a href>/</a>
                        <a href>AC</a>
                        <a href>=</a>
                    </div>
                </div>
            </div>
        </div>

        <script>
            const display = document.querySelector('.display');
const buttons = document.querySelectorAll('.calci a');

let currentInput = '';

buttons.forEach(button => {
    button.addEventListener('click', (event) => {
        event.preventDefault();

        const value = button.textContent;

        if (value === 'AC') {
            currentInput = '';
            display.textContent = '';
        } else if (value === '=') {
            try {
                if (currentInput === '') return;
                const result = eval(currentInput);
                display.textContent = result;
                currentInput = result.toString();
            } catch (error) {
                display.textContent = 'Error';
                currentInput = '';
            }
        } else {
            currentInput += value;
            display.textContent = currentInput;
        }
    });
});
        </script>
    </body>
</html>
